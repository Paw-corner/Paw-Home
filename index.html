
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paw Corner ♡</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --green: #bee2a0;
  --pink: #fdc6db;
  --butter: #ffedb8;
  --hotpink: #fe89b6;
  --yellow: #ffcd71;
}

body {
  min-height: 100vh;
  font-family: 'Trebuchet MS', sans-serif;
  background: var(--butter);
  color: #795568;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 430px;
  background: var(--pink);
  padding: 35px 25px;
  border-radius: 28px;
  text-align: center;
  border: 3px solid white;
  box-shadow: 0 9px 0 var(--yellow);
}

.decoration {
  font-size: 32px;
  margin-bottom: 12px;
  color: var(--hotpink);
}

h1 {
  font-family: Georgia, serif;
  font-size: 40px;
  letter-spacing: 2px;
  color: #a34e76;
}

.subtitle {
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 9px;
  color: #a34e76;
}

.welcome {
  margin: 30px 0 20px;
  font-family: Georgia, serif;
  font-size: 18px;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.menu a {
  display: block;
  text-decoration: none;
  border-radius: 17px;
  padding: 19px;
  color: #795568;
  border: 2px solid white;
  transition: 0.3s;
}

.menu a:nth-child(1) {
  background: var(--green);
}

.menu a:nth-child(2) {
  background: var(--yellow);
}

.menu a:nth-child(3) {
  background: var(--hotpink);
}

.menu a:nth-child(4) {
  background: var(--butter);
}

.menu a:hover {
  transform: translateY(-4px) scale(1.02);
  filter: brightness(1.04);
}

.menu h2 {
  font-size: 16px;
  letter-spacing: 2px;
}

.menu p {
  font-size: 11px;
  margin-top: 6px;
}

footer {
  margin-top: 30px;
  font-size: 11px;
  color: #a34e76;
}

</style>
</head>

       target="_blank" rel="noopener noreferrer">

    </a>

       target="_blank" rel="noopener noreferrer">
